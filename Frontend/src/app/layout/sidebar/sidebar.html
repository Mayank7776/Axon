<!-- Backdrop Blur Overlay -->
<div 
  class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 md:hidden transition-all duration-300"
  (click)="onClose()"
></div>

<!-- Drawer Content Panel -->
<div class="fixed top-0 right-0 bottom-0 w-72 bg-white shadow-2xl z-50 flex flex-col justify-between p-6 md:hidden border-l border-slate-100 animate-slide-in">
  
  <!-- Top Section: Header Brand & Nav Tabs -->
  <div class="flex flex-col gap-6">
    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
      <a routerLink="/" (click)="onClose()" class="flex items-center">
        <img src="/AxonLogo.png" alt="Axon Logo" class="h-10 w-auto object-contain" />
      </a>
      <button 
        (click)="onClose()" 
        class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-xl transition-all duration-200"
        aria-label="Close menu"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    
    <!-- Navigation Links -->
    <nav class="flex flex-col gap-1.5">
      <a routerLink="/home" 
         routerLinkActive="bg-violet-50 text-violet-600 font-bold" 
         [routerLinkActiveOptions]="{exact: true}"
         (click)="onClose()" 
         class="flex items-center px-4 py-3 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200">
        Home
      </a>
      <a routerLink="/workouts" 
         routerLinkActive="bg-violet-50 text-violet-600 font-bold" 
         (click)="onClose()" 
         class="flex items-center px-4 py-3 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200">
        Workouts
      </a>
      <a routerLink="/progress" 
         routerLinkActive="bg-violet-50 text-violet-600 font-bold" 
         (click)="onClose()" 
         class="flex items-center px-4 py-3 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200">
        Progress
      </a>
      <a routerLink="/chat" 
         routerLinkActive="bg-violet-50 text-violet-600 font-bold" 
         (click)="onClose()" 
         class="flex items-center px-4 py-3 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200">
        Chat
      </a>
      <a routerLink="/blog" 
         routerLinkActive="bg-violet-50 text-violet-600 font-bold" 
         (click)="onClose()" 
         class="flex items-center px-4 py-3 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200">
        Blog
      </a>
    </nav>
  </div>

  <!-- Bottom Section: User Info, Profile, Settings & Logout -->
  <div class="flex flex-col gap-3.5 border-t border-slate-100 pt-5">
    
    <!-- User Metadata Display -->
    <div class="flex items-center gap-3 px-2 py-1 mb-1">
      <div class="h-10 w-10 overflow-hidden rounded-xl border-2 border-violet-100 flex-shrink-0">
        <img 
          src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" 
          alt="User avatar" 
          class="h-full w-full object-cover" 
        />
      </div>
      <div class="overflow-hidden">
        <p class="text-sm font-bold text-slate-800 leading-tight truncate">user@axon.com</p>
        <p class="text-xs text-slate-400 font-medium mt-0.5">Standard User</p>
      </div>
    </div>

    <!-- Profile Page Link -->
    <a routerLink="/profile" 
       (click)="onClose()" 
       class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200">
      <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      My Profile
    </a>

    <!-- Settings Page Link -->
    <a routerLink="/settings" 
       (click)="onClose()" 
       class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-200">
      <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      </svg>
      Settings
    </a>

    <!-- Logout Action Button -->
    <button 
      class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-bold text-red-500 hover:bg-red-50 hover:text-red-700 transition-all duration-200 w-full text-left"
    >
      <svg class="h-5 w-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      Sign Out
    </button>

  </div>

</div>
