<header class="sticky top-0 z-50 w-full border-b border-slate-150 bg-white/80 backdrop-blur-md transition-all duration-300">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    
    <!-- Left: Logo & Brand -->
    <div class="flex items-center">
      <a routerLink="/" class="flex items-center group transition-transform duration-200 active:scale-95">
        <img src="/AxonLogo.png" alt="Axon Logo" class="h-12 w-auto object-contain transition-transform duration-300 group-hover:scale-105" />
      </a>
    </div>

    <!-- Center: Navigation Links (Hidden on Mobile) -->
    <nav class="hidden md:flex items-center space-x-8">
      <a routerLink="/home" 
         routerLinkActive="text-violet-600 font-semibold border-violet-600" 
         [routerLinkActiveOptions]="{exact: true}"
         class="text-sm font-medium text-slate-600 hover:text-slate-900 py-5 border-b-2 border-transparent transition-all duration-200">
        Home
      </a>
      <a routerLink="/workouts" 
         routerLinkActive="text-violet-600 font-semibold border-violet-600" 
         class="text-sm font-medium text-slate-600 hover:text-slate-900 py-5 border-b-2 border-transparent transition-all duration-200">
        Workouts
      </a>
      <a routerLink="/progress" 
         routerLinkActive="text-violet-600 font-semibold border-violet-600" 
         class="text-sm font-medium text-slate-600 hover:text-slate-900 py-5 border-b-2 border-transparent transition-all duration-200">
        Progress
      </a>
      <a routerLink="/chat" 
         routerLinkActive="text-violet-600 font-semibold border-violet-600" 
         class="text-sm font-medium text-slate-600 hover:text-slate-900 py-5 border-b-2 border-transparent transition-all duration-200">
        Chat
      </a>
      <a routerLink="/blog" 
         routerLinkActive="text-violet-600 font-semibold border-violet-600" 
         class="text-sm font-medium text-slate-600 hover:text-slate-900 py-5 border-b-2 border-transparent transition-all duration-200">
        Blog
      </a>
    </nav>

    <!-- Right: Utility Actions (Notifications, Settings, Profile, Mobile Menu Toggle) -->
    <div class="flex items-center gap-2 sm:gap-4">
      
      <!-- Notifications Button (Always Visible) -->
      <div class="relative">
        <button 
          (click)="toggleNotifications()"
          class="relative p-2 text-slate-600 hover:text-violet-600 hover:bg-slate-50 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-violet-500/20 active:scale-95"
          aria-label="Notifications"
        >
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="absolute top-2 right-2.5 flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-violet-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-violet-600"></span>
          </span>
        </button>

        <!-- Notifications Panel -->
        @if (isNotificationsOpen()) {
          <div class="absolute right-0 mt-2 w-80 rounded-2xl border border-slate-100 bg-white p-4 shadow-xl ring-1 ring-black/5 transition-all duration-200">
            <div class="flex items-center justify-between border-b border-slate-50 pb-2 mb-2">
              <h3 class="text-sm font-semibold text-slate-800">Notifications</h3>
              <span class="text-xs text-violet-600 hover:underline cursor-pointer">Mark all as read</span>
            </div>
            <div class="flex flex-col gap-2 py-4 items-center justify-center text-slate-400">
              <svg class="h-8 w-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <p class="text-xs font-medium mt-1">No new notifications</p>
            </div>
          </div>
        }
      </div>

      <!-- Settings Button (Hidden on Mobile) -->
      <a 
        routerLink="/settings"
        class="hidden md:inline-flex p-2 text-slate-600 hover:text-violet-600 hover:bg-slate-50 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-violet-500/20 active:scale-95"
        aria-label="Settings"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </a>

      <!-- Profile Button (Hidden on Mobile) -->
      <div class="relative hidden md:block">
        <button 
          (click)="toggleProfileDropdown()"
          class="flex h-9 w-9 overflow-hidden rounded-xl border-2 border-violet-100 hover:border-violet-500 hover:scale-105 active:scale-95 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-violet-500/20"
        >
          <img 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" 
            alt="User avatar" 
            class="h-full w-full object-cover" 
          />
        </button>

        <!-- Profile Dropdown Menu (Desktop Only) -->
        @if (isProfileDropdownOpen()) {
          <div class="absolute right-0 mt-2 w-48 rounded-2xl border border-slate-100 bg-white py-2 shadow-xl ring-1 ring-black/5 transition-all duration-200">
            <div class="border-b border-slate-50 px-4 py-2 mb-1">
              <p class="text-xs text-slate-400">Signed in as</p>
              <p class="text-sm font-semibold text-slate-700 truncate">user@axon.com</p>
            </div>
            <a 
              routerLink="/profile" 
              class="flex items-center gap-2 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              My Profile
            </a>
            <a 
              routerLink="/settings" 
              class="flex items-center gap-2 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              </svg>
              Settings
            </a>
            <div class="border-t border-slate-50 mt-1 pt-1">
              <button 
                class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-red-500 hover:bg-slate-50 hover:text-red-700 transition-colors"
              >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Sign Out
              </button>
            </div>
          </div>
        }
      </div>

      <!-- Hamburger Menu Toggle Button (Mobile Only) -->
      <button 
        (click)="toggleMobileMenu()"
        class="p-2 text-slate-600 hover:text-violet-600 hover:bg-slate-50 rounded-xl transition-all duration-200 md:hidden focus:outline-none focus:ring-2 focus:ring-violet-500/20 active:scale-95"
        aria-label="Toggle mobile menu"
      >
        @if (!isMobileMenuOpen()) {
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        } @else {
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>

    </div>

  </div>

</header>

<!-- Mobile Sidebar / Drawer (Slide-Out Component) -->
@if (isMobileMenuOpen()) {
  <app-sidebar (close)="closeMobileMenu()"></app-sidebar>
}
