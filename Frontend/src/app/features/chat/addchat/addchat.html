<div class="min-h-full flex items-center justify-center p-6 sm:p-12">
  <div class="relative w-full max-w-2xl bg-[#0f1219]/90 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl overflow-hidden">
    
    <!-- Background Gradient Effect -->
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500/20 rounded-full blur-3xl opacity-50 mix-blend-screen pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-purple-500/20 rounded-full blur-3xl opacity-50 mix-blend-screen pointer-events-none"></div>

    <div class="relative p-8 sm:p-12">
      <!-- Header -->
      <div class="mb-10 text-center">
        <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 tracking-tight">
          @if (existingModel) { Update } @else { Create New } Model
        </h2>
        <p class="mt-3 text-sm text-gray-400 font-medium">
          Configure your AI assistant's persona and capabilities.
        </p>
      </div>

      <!-- Form -->
      <form [formGroup]="modelForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Name Field -->
        <div class="space-y-2">
          <label for="name" class="block text-sm font-semibold text-gray-300 ml-1">Model Name</label>
          <div class="relative">
            <input 
              type="text" 
              id="name" 
              formControlName="name"
              class="block w-full rounded-2xl border-0 bg-white/5 py-3.5 pl-4 pr-10 text-white shadow-sm ring-1 ring-inset ring-white/10 placeholder:text-gray-500 focus:ring-2 focus:ring-inset focus:ring-blue-500 sm:text-sm sm:leading-6 transition-all duration-300 hover:bg-white/10"
              placeholder="e.g., Coach Sarah, Keto Bot"
            >
          </div>
        </div>

        <!-- Description Field -->
        <div class="space-y-2">
          <label for="description" class="block text-sm font-semibold text-gray-300 ml-1">Description</label>
          <div class="relative">
            <textarea 
              id="description" 
              formControlName="description"
              rows="4"
              class="block w-full rounded-2xl border-0 bg-white/5 py-3.5 pl-4 pr-10 text-white shadow-sm ring-1 ring-inset ring-white/10 placeholder:text-gray-500 focus:ring-2 focus:ring-inset focus:ring-blue-500 sm:text-sm sm:leading-6 transition-all duration-300 hover:bg-white/10 resize-none"
              placeholder="Describe what this model does..."
            ></textarea>
          </div>
        </div>

        <!-- Type Selection -->
        <div class="space-y-3">
          <label class="block text-sm font-semibold text-gray-300 ml-1">Model Specialization</label>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            @for (type of modelTypes; track type.value) {
              <label 
                class="relative flex cursor-pointer rounded-2xl border bg-white/5 p-4 focus:outline-none hover:bg-white/10 transition-all duration-300"
                [class]="modelForm.get('type')?.value === type.value ? 'border-blue-500 ring-1 ring-blue-500 bg-blue-500/10' : 'border-white/10'"
              >
                <input 
                  type="radio" 
                  formControlName="type" 
                  [value]="type.value" 
                  class="sr-only"
                >
                <span class="flex flex-1">
                  <span class="flex flex-col">
                    <span class="block text-sm font-medium" [class]="modelForm.get('type')?.value === type.value ? 'text-blue-400' : 'text-gray-300'">
                      {{ type.label }}
                    </span>
                  </span>
                </span>
                <!-- Check Icon for active state -->
                @if (modelForm.get('type')?.value === type.value) {
                  <svg class="h-5 w-5 text-blue-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                  </svg>
                }
              </label>
            }
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-8 flex items-center justify-end gap-x-4 pt-6 border-t border-white/10">
          <button 
            type="button" 
            (click)="cancel()"
            class="text-sm font-semibold leading-6 text-gray-300 hover:text-white transition-colors duration-200 px-4 py-2 rounded-xl hover:bg-white/5"
          >
            Cancel
          </button>
          <button 
            type="submit" 
            [disabled]="modelForm.invalid"
            class="rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:from-blue-400 hover:to-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed transform hover:-translate-y-0.5"
          >
            @if (existingModel) { Update } @else { Create } Model
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
