services:

  backend:
    build:
      context: ./Backend

    ports:
      - "8000:8000"

    env_file:
      - ./Backend/.env

    volumes:
      - ./Backend:/app
      - /app/venv
      - /app/.venv

  frontend:
    build:
      context: ./Frontend

    ports:
      - "4200:4200"

    depends_on:
      - backend

    volumes:
      - ./Frontend:/app
      - /app/node_modules
      - /app/.angular